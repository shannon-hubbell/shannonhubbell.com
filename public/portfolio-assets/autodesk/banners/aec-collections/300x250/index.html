<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="ad.size" content="width=300,height=250">
	<script type="text/javascript">
		var clickTag = "http://www.example.com";
	</script>
	<title>Autodesk Banner</title>

	<style type="text/css">

		body {
			margin:0;
			padding:0;

		}

		img {
			position:absolute;
		}

		#wrapper {
			width:298px;
			height:248px;
			border: 1px solid #000;
			overflow:hidden;
			position:relative;
			cursor: pointer;
		}

		#overlay {
			left:0;
			right:0;
		}

		.animated {
		    -webkit-animation-duration: 7s;
		            animation-duration: 7s;
		    -webkit-animation-timing-function: linear;
		            animation-timing-function: linear;
			-webkit-animation-fill-mode: forwards;
			        animation-fill-mode: forwards;
			-webkit-animation-iteration-count: 2;
			        animation-iteration-count: 2;
		}

		#bkgd {
			bottom:0;
			right:0;
			-webkit-transform: translateZ(0);
			-webkit-animation-name: zoombkgd;
			        animation-name: zoombkgd;
		}

		@-webkit-keyframes zoombkgd {
		    0% {
		        -webkit-transform: scale(1.1);
		    }
		    100% {
		        -webkit-transform: scale(1.0);
		    } 
    	}
		@keyframes zoombkgd {
		    0% {
		        transform: scale(1.15) rotate(0deg);
		    }
		    100% {
		    	transform: scale(1.0) rotate(0.02deg);
		    } 
    	}

    	#h1 {
    		top:37px;
			left:10px;
			opacity:0;
			-webkit-animation-name: h1;
			        animation-name: h1;
		}

    	@-webkit-keyframes h1 {
			25% {
				opacity: 0;
			}
			30% {
				opacity: 1;
			}
			100% {
				opacity: 1;
			}
    	}

    	@keyframes h1 {
			25% {
				opacity: 0;
			}
			30% {
				opacity: 1;
			}
			100% {
				opacity: 1;
			}
    	}

    	#h2 {
    		left:10px;
    		top:96px;
    		opacity: 0;
			-webkit-animation-name: h2;
			        animation-name: h2;
    	}

    	@-webkit-keyframes h2 {
			37% {
				opacity: 0;
			}
			42% {
				opacity: 1;
			}
			100% {
				opacity: 1;
			}
    	}

    	@keyframes h2 {
			37% {
				opacity: 0;
			}
			42% {
				opacity: 1;
			}
			100% {
				opacity: 1;
			}
    	}

    	#cta-box {
    		position: absolute;
    		bottom:0;
    		left:0;
    		background: rgba(255,255,255,.95);
    		width: 100%;
    		height: 41px;
    	}

    	#cta {
    		left:0;
    		bottom:76px;
    		opacity: 0;
			-webkit-animation-name: cta;
			        animation-name: cta;
    	}

    	@keyframes cta {
			47% {
				opacity: 0;
			}
			52% {
				opacity: 1;
			}
			100% {
				opacity: 1;
			}
    	}

		#logo {
			left:9px;
			bottom:18px;
		}

		#name {
			right: 0;
			bottom: 0;
		}

    	#white-flash {
    		width:100%;
    		height:100%;
    		position:absolute;
    		top:0;
    		left:0;
    		background:#FFF;
    		opacity:1;
			-webkit-animation-name: whiteflash;
			        animation-name: whiteflash;
		    -webkit-animation-duration: 14s;
		            animation-duration: 14s;
		    -webkit-animation-timing-function: linear;
		            animation-timing-function: linear;
			-webkit-animation-fill-mode: forwards;
			        animation-fill-mode: forwards;
			-webkit-animation-iteration-count: 1;
			        animation-iteration-count: 1;
		}

    	@-webkit-keyframes whiteflash {
			0% {
				opacity:1;
			}
			3% {
				opacity:0;
			}
			48% {
				opacity: 0;
			}
			50% {
				opacity: 1
			}
			51% {
				opacity: 0
			}
			100% {
				opacity: 0;
			}
    	}

    	@keyframes whiteflash {
			0% {
				opacity:1;
			}
			3% {
				opacity:0;
			}
			48% {
				opacity: 0;
			}
			50% {
				opacity: 1
			}
			51% {
				opacity: 0
			}
			100% {
				opacity: 0;
			}
		}

	</style>

</head>
<body>

<div id="wrapper" onclick="window.open(clickTag ,'_blank');">

	<img src="bkgd.jpg" alt="" id="bkgd" class="animated">

	<img src="h1.png" alt="Ready to Make Anything" id="h1" class="animated">

	<img src="h2.png" alt="Get the Collection for as low as $224/month" id="h2" class="animated">

	<img src="cta.gif" alt="Learn More" id="cta" class="animated">
	
	<img src="logo.png" alt="Autodesk Architecture, Engineering & Construction Collection" id="logo">

	<img src="name.png" alt="Kirsty Hogg Cundall" id="name">

	<div id="white-flash"></div>

</div>
	
</body>
</html>
